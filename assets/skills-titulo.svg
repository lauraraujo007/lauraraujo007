<svg xmlns="http://www.w3.org/2000/svg" width="180" height="44" viewBox="0 0 180 44" role="img" aria-label="Skills" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- rx = quão redonda é a borda (22 = metade da altura, vira uma pílula) -->
  <!-- fill = cor de dentro | stroke = cor da linha da borda -->
  <rect x="1" y="1" width="178" height="42" rx="22" fill="#8EE6A0" stroke="#72CF86" stroke-width="2"/>
  <!-- fill = cor da letra | font-family = fonte (só funcionam fontes que já existem no computador) -->
  <text x="90" y="23" text-anchor="middle" dominant-baseline="central"
        font-family="'Fira Code','JetBrains Mono','Courier New',monospace"
        font-size="16" font-weight="700" letter-spacing="4" fill="#0D1117">SKILLS</text>
</svg>
