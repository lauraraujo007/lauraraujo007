name: generate animation

on:
  # roda sozinho todo dia à meia-noite
  schedule:
    - cron: "0 0 * * *"

  # permite rodar na mão pela aba Actions
  workflow_dispatch:

  # roda a cada push na branch main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # gera as imagens da cobrinha (clara e escura)
      # CORES: color_snake = cobrinha | color_dots = quadradinhos (do vazio ao mais forte)
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#EBAEB5&color_dots=#ebedf0,#91D2DB,#72CF86,#8EE6A0,#E6E075
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#EBAEB5&color_dots=#161b22,#72CF86,#91D2DB,#8EE6A0,#E6E075
      # guarda as imagens numa branch chamada "output"
      - name: push svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
